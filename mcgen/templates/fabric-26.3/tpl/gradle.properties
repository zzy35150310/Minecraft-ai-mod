# 加内存给 gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 跨国拉 maven.fabricmc.net 实测只有 4~27 KB/s，且会突发性停顿。
# gradle 默认 30 秒 socket 超时会把"慢，但确实在动"的连接直接掐掉，
# 表现就是 Read timed out 构建失败（实测踩过，8 分钟后整个构建崩掉）。
# 放宽超时让慢连接有机会跑完，比换镜像靠谱——没有可用的 fabric maven 镜像。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000

# Fabric 版本参数
minecraft_version={{mc_version}}
loader_version={{loader_version}}
loom_version={{loom_version}}

# 模组参数
version={{version}}
group={{group}}

# 依赖
fabric_api_version={{fabric_api_version}}
